# =============================================================================
# PATTERN 1 — agent.ts: Extract Method for runLoop
# =============================================================================
- target: packages/deep-factor-agent/src/agent.ts
  rank: 1
  composite_score: 86.6
  root_cause: >
    The runLoop method (lines 1025–1639) is 615 lines with 10-level nesting.
    It handles: model invocation, message building, tool execution (parallel + sequential),
    error recovery, plan parsing, human-input-the-loop flow, verification, stop conditions,
    middleware hooks, and usage accumulation — all in a single method.
  pattern: Extract Method
  description: |
    Extract the inner tool-calling while-loop (lines 1168–1375) into a dedicated
    private method `executeToolStep()` that returns a structured result indicating
    whether to continue, break with a pending request, or accumulate usage.

    Extract the post-iteration logic (stop conditions, verification, plan handling,
    lines 1419–1584) into `evaluateIterationResult()`.

    This reduces runLoop from ~615 lines to ~80 lines of orchestration, with
    each extracted method being independently testable.
  estimated_impact:
    cc_reduction: "-40%"
    cognitive_reduction: "-55%"
    coupling_reduction: "0%"
  files_affected:
    - packages/deep-factor-agent/src/agent.ts (refactor, no new files)
  risk: LOW — internal method extraction, no public API change

# =============================================================================
# PATTERN 2 — agent.ts: Extract Method for executeToolCall
# =============================================================================
- target: packages/deep-factor-agent/src/agent.ts
  rank: 1
  composite_score: 86.6
  root_cause: >
    executeToolCall (lines 746–981, 235 lines) has 5 nearly identical branches
    that each: create a ToolResultEvent, call appendEvent, and return a ToolOutcome.
    The only variation is the result string and whether it's pending.
  pattern: Guard Clauses + Helper extraction
  description: |
    Extract a `buildToolOutcome()` helper that encapsulates the repeated pattern of
    creating ToolResultEvent + ToolMessage + ToolOutcome. Use early returns (guard clauses)
    for the HITL, interruptOn, deny, and request_approval cases.

    This collapses 5 blocks of ~30 lines each into 5 guard clause calls of ~5 lines each.
  estimated_impact:
    cc_reduction: "-25%"
    cognitive_reduction: "-35%"
    coupling_reduction: "0%"
  files_affected:
    - packages/deep-factor-agent/src/agent.ts (refactor, no new files)
  risk: LOW — internal method extraction, no public API change

# =============================================================================
# PATTERN 3 — claude-cli.ts: Extract Method for stream processing
# =============================================================================
- target: packages/deep-factor-agent/src/providers/claude-cli.ts
  rank: 2
  composite_score: 47.2
  root_cause: >
    invokeStream/invokeWithUpdates methods contain inline Promise construction
    with deeply nested event parsing callbacks. processStreamLine handles 15+
    event types in a single switch statement.
  pattern: Extract Method + Event Handler Map
  description: |
    Replace the monolithic processStreamLine switch with a Record<string, handler>
    dispatch map. Each event type handler becomes a small pure function.

    This eliminates the 15-branch switch, makes each handler independently testable,
    and reduces nesting by 2 levels.
  estimated_impact:
    cc_reduction: "-35%"
    cognitive_reduction: "-40%"
    coupling_reduction: "0%"
  files_affected:
    - packages/deep-factor-agent/src/providers/claude-cli.ts (refactor)
  risk: LOW — internal refactor, ModelAdapter interface unchanged

