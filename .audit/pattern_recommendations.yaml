# =============================================================================
# PATTERN 1 — agent.ts: Extract tool execution from runLoop
# =============================================================================
- target: packages/deep-factor-agent/src/agent.ts
  rank: 1
  composite_score: 86.6
  root_cause: >
    runLoop (lines ~990–1599, ~600 lines) contains the inner tool-calling
    while-loop (lines 1137–1334) with parallel and sequential execution paths,
    each deeply nested (8+ levels). This single method handles: model invocation,
    stream update dispatch, parallel tool batching, sequential tool fallback,
    tool result emission, and ToolMessage construction.
  pattern: Extract Method
  description: |
    Extract the inner while-loop body (lines 1137–1334) into a private method
    `executeToolCalls(toolCalls, messages, thread, iteration, ...)` that:
    - Accepts the tool calls array, message accumulator, thread, and iteration
    - Contains the parallel/sequential partitioning logic
    - Returns { pendingRequest, stepCount } so runLoop can make its control-flow decision
    - Keeps appendToolCallIfNew and the parallel execution as internal details

    This removes ~200 lines from runLoop and flattens nesting by 2 levels.
    The extracted method is independently testable.
  estimated_impact:
    cc_reduction: "-30%"
    cognitive_reduction: "-45%"
    coupling_reduction: "0%"
  files_affected:
    - packages/deep-factor-agent/src/agent.ts (refactor, no new files)
  risk: LOW — internal method extraction, no public API change
  status: pending

# =============================================================================
# PATTERN 2 — agent.ts: Extract post-iteration evaluation from runLoop
# =============================================================================
- target: packages/deep-factor-agent/src/agent.ts
  rank: 1
  composite_score: 86.6
  root_cause: >
    After the tool-calling while-loop, runLoop has ~260 lines (1336–1598) of
    post-iteration evaluation: stop condition checks, pending request handling,
    verification callback, plan mode logic, completion events, and error recovery.
    This section has 5-level nesting with multiple early-return paths.
  pattern: Extract Method
  description: |
    Extract lines 1336–1598 into a private method
    `evaluateIterationResult(context)` that takes a structured context object
    containing thread, usage, iteration, lastResponse, parsedPlan, pendingRequest,
    and returns either an AgentResult (to exit) or null (to continue the loop).

    This reduces runLoop to ~80 lines of pure orchestration:
    setup → middleware → model invoke → executeToolCalls → evaluateIterationResult → loop.

    Each extracted method has a clear contract and is independently testable.
  estimated_impact:
    cc_reduction: "-25%"
    cognitive_reduction: "-35%"
    coupling_reduction: "0%"
  files_affected:
    - packages/deep-factor-agent/src/agent.ts (refactor, no new files)
  risk: LOW — internal method extraction, no public API change
  status: pending

# =============================================================================
# PATTERN 3 — claude-cli.ts: Event Handler Map for processStreamLine
# =============================================================================
- target: packages/deep-factor-agent/src/providers/claude-cli.ts
  rank: 2
  composite_score: 47.9
  root_cause: >
    processStreamLine (lines 408–551, 143 lines) dispatches on event.type via
    a chain of if-statements: "assistant", "stream_event", "result", "error",
    plus a default path. Each branch is 15–40 lines with 3–5 levels of nesting.
    The "assistant" branch further dispatches on content block types.
  pattern: Event Handler Map
  description: |
    1. Define a handler type: `type StreamEventHandler = (event, state, onUpdate) => void`
    2. Create a `Record<string, StreamEventHandler>` mapping event types to handlers:
       - handleAssistantEvent (lines 465–493)
       - handleStreamEvent (lines 495–501)
       - handleResultEvent (lines 503–533)
       - handleErrorEvent (lines 535–548)
    3. Replace the if-chain with: `handlers[type]?.(event, state, onUpdate)`
    4. Keep the metadata extraction (lines 438–463) before dispatch — it's shared.

    Per prior reflection: define the StreamEventHandler type signature FIRST
    before extracting any functions.
  estimated_impact:
    cc_reduction: "-35%"
    cognitive_reduction: "-40%"
    coupling_reduction: "0%"
  files_affected:
    - packages/deep-factor-agent/src/providers/claude-cli.ts (refactor)
  risk: LOW — internal refactor, ModelAdapter interface unchanged
  status: pending

