    cognitive_reduction: "-30%"
    coupling_reduction: "0%"
  files_affected:
    - packages/deep-factor-agent/src/providers/claude-agent-sdk.ts (refactor)
  risk: LOW — internal method extraction, no public API change
  status: pending

