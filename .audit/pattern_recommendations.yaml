# =============================================================================
# PATTERN 5 — log-mappers: Template Method for event dispatch
# =============================================================================
- target: packages/deep-factor-agent/src/log-mappers/
  rank: 7-9-13-19
  composite_score: 28.1 / 27.1 / 24.4 / 21.6 (avg 25.3)
  root_cause: >
    Four mapper files (replay.ts, langchain-mapper.ts, claude-mapper.ts,
    codex-mapper.ts) each implement event-type dispatch via large switch
    statements. They share the same structural pattern but for different
    event source formats.
  pattern: Strategy Pattern (event handler registry)
  description: |
    Define a MapperStrategy interface with per-event-type handler methods.
    Each mapper implements the strategy for its source format.
    A shared dispatch function iterates events and delegates to the strategy.

    This is a structural improvement for maintainability but the CC reduction
    per file is moderate since each switch case is already fairly simple.
  estimated_impact:
    cc_reduction: "-15%"
    cognitive_reduction: "-20%"
    coupling_reduction: "-10%"
  files_affected:
    - packages/deep-factor-agent/src/log-mappers/replay.ts
    - packages/deep-factor-agent/src/log-mappers/langchain-mapper.ts
    - packages/deep-factor-agent/src/log-mappers/claude-mapper.ts
    - packages/deep-factor-agent/src/log-mappers/codex-mapper.ts
    - packages/deep-factor-agent/src/log-mappers/types.ts (extend)
  risk: MEDIUM — touches 5 files, requires careful type alignment

